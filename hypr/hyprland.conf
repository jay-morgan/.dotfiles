# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/

# Use defaults Omarchy defaults (but don't edit these directly!)
source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.local/share/omarchy/default/hypr/looknfeel.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf
source = ~/.config/omarchy/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, class:qemu

# Override default swapwindow behavior for cross-monitor moves
unbind = SUPER SHIFT, LEFT
unbind = SUPER SHIFT, RIGHT
unbind = SUPER SHIFT, UP
unbind = SUPER SHIFT, DOWN

# Move windows to adjacent monitor (context-aware)
bindd = SUPER SHIFT, LEFT, Move window to left monitor, exec, ~/.config/hypr/scripts/move-window-to-monitor.sh left
bindd = SUPER SHIFT, RIGHT, Move window to right monitor, exec, ~/.config/hypr/scripts/move-window-to-monitor.sh right
bindd = SUPER SHIFT, UP, Move window to monitor above, exec, ~/.config/hypr/scripts/move-window-to-monitor.sh up
bindd = SUPER SHIFT, DOWN, Move window to monitor below, exec, ~/.config/hypr/scripts/move-window-to-monitor.sh down

# Swap windows (will cross monitors if adjacent)
bindd = SUPER CTRL, LEFT, Swap window left, swapwindow, l
bindd = SUPER CTRL, RIGHT, Swap window right, swapwindow, r
bindd = SUPER CTRL, UP, Swap window up, swapwindow, u
bindd = SUPER CTRL, DOWN, Swap window down, swapwindow, d

# Workspace assignments
workspace = 1, monitor:desc:Dell Inc. DELL U2723QE, persistent:true
workspace = 2, monitor:desc:Dell Inc. DELL U2723QE, persistent:true
workspace = 3, monitor:desc:Dell Inc. DELL U2723QE, persistent:true
workspace = 4, monitor:desc:Dell Inc. DELL U2723QE, persistent:true
workspace = 5, monitor:desc:Dell Inc. DELL U2723QE, persistent:true
workspace = 6, monitor:desc:Dell Inc. DELL U2723QE, persistent:true
workspace = 7, monitor:desc:Dell Inc. DELL U2723QE, persistent:true
workspace = 8, monitor:desc:Dell Inc. DELL U2723QE, persistent:true
workspace = 9, monitor:desc:Dell Inc. DELL U2723QE, persistent:true
workspace = 10, monitor:eDP-1, persistent:true
workspace = 11, monitor:desc:Dell Inc. DELL U2421E, persistent:true

# Monitor hotplug script
exec-once = hyprland-monitor-attached ~/.config/hypr/scripts/monitor-hotplug.sh ~/.config/hypr/scripts/monitor-hotplug.sh

# Run monitor config on startup/wake
exec-once = hyprland-monitor-attached ~/.config/hypr/scripts/monitor-hotplug.sh
exec = ~/.config/hypr/scripts/monitor-hotplug.sh   # Run on every Hyprland reload (theme change)
# Run on wake from sleep
exec-once = swayidle -w timeout 1 'if pgrep -x swaylock; then :; else ~/.config/hypr/scripts/monitor-hotplug.sh; fi' resume '~/.config/hypr/scripts/monitor-hotplug.sh'

# Toggle config flags dynamically
source = ~/.local/state/omarchy/toggles/hypr/*.conf
